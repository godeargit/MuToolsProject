name: Build Tauri App

on:
  push:
    branches: [ "main", "master" ]  # 当推送代码到 main 或 master 分支时触发
    tags:
      - 'v1.1.0'                      # 或者当推送 v 开头的版本标签时触发
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]  # 只需要构建 Windows 版本可以只写 windows-latest

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: "tauri-app"
          workspaces: "MuToolsCode" # 指向你项目实际存放 Cargo.toml 的目录

      - name: Install frontend dependencies & Build
        run: |
          npm install
        working-directory: MuToolsCode

      - name: Run Tauri Action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "MuToolsCode"     # 核心：指定 Tauri 项目所在的子目录
          tagName: app-v__VERSION__
          releaseName: 'MuTools v__VERSION__'
          releaseBody: 'Automated build for MuTools.'
          releaseDraft: false
          prerelease: false
